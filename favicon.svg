<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A68">
  <title>A68</title>
  <!-- The A is drawn as strokes rather than set as type: a favicon renders at 16px, where a
       typeface is illegible anyway, and drawing it means the icon never depends on a font
       being available. The blue is the site's accent, held the same in both themes so the
       icon stays recognisable in a row of tabs. -->
  <rect width="64" height="64" rx="14" fill="#1a4f97"/>
  <path d="M19 47 L32 17 L45 47 M24.5 38 H39.5"
        fill="none" stroke="#ffffff" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
