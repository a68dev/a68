<body class="home">
<!-- The scroll happens INSIDE this element, not on the document. That is what lets the
     photograph stay perfectly still: a fixed layer is only dragged off-screen when the document
     itself rubber-bands, and here the document never scrolls at all. The bounce is still there —
     it just happens to the content, over a background that cannot move. -->
<div class="scroll">
<main>

  <header class="hero panel">
    <svg class="mark mark-hero" viewBox="0 0 360 100" role="img" aria-label="A68">
      <title>A68</title>
      <text x="180" y="84" text-anchor="middle"><tspan class="a">A</tspan><tspan class="s">6</tspan><tspan class="e">8</tspan></text>
    </svg>
    <!-- The separators are marked aria-hidden so a screen reader says "small focus purpose"
         rather than reading three vertical-line characters aloud. -->
    <h1 class="triad"><span>small</span><i aria-hidden="true">|</i><span>focus</span><i aria-hidden="true">|</i><span>purpose</span></h1>
    <p class="lede">By Michael</p>
  </header>

  <div class="ends panel">
    <h2>Get in touch</h2>
    <div class="card">
      <p><a href="mailto:michael@a68.ca">michael@a68.ca</a></p>
    </div>

    <footer>
      &copy; 2026 A68
    </footer>
  </div>

</main>
</div>
<!-- ?v= is a cache buster. Browsers hold on to a script hard, especially over file://, and a
     stale copy of this one looks exactly like a bug in the current one. Bump it on every edit. -->
<script src="mark.js?v=8"></script>
</body>
